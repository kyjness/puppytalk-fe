name: CD

# 빌드 산출물을 S3에 올리고 CloudFront 캐시를 비운다.
# 자격은 OIDC AssumeRole로만 받는다 — 장기 AK/SK를 저장소에 두지 않는다.
# 대상 버킷·배포 ID·롤 ARN은 puppytalk-infra 의 demo/ terraform output 값이다.

# main 푸시에 바로 걸지 않고 CI 성공 뒤에 도는 이유: push 트리거로 두면 lint·typecheck·테스트가
# 깨진 커밋도 그대로 배포된다(두 워크플로가 병렬로 돌아 서로를 막지 못한다).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: S3 배포 + CloudFront 무효화
    # workflow_dispatch에는 conclusion이 없으므로 CI 성공 조건과 OR로 묶는다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC 토큰 발급에 필요
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # workflow_run은 기본 브랜치 HEAD를 체크아웃한다 — CI가 통과한 바로 그 커밋을 배포한다.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # 예: https://api.puppytalk.shop/v1 — 빌드 시점에 번들에 박힌다.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: puppytalk-fe-deploy
          aws-region: ap-northeast-2

      - name: Deploy to S3
        env:
          BUCKET: ${{ secrets.FRONTEND_BUCKET }}
        run: |
          # 해시가 붙은 자산은 영구 캐시, index.html만 매번 새로 받게 한다.
          # 이 구분이 없으면 배포 후에도 캐시된 옛 index.html이 옛 번들을 계속 가리킨다.
          aws s3 sync dist/ "s3://$BUCKET" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          # index.html만 무효화하면 된다 — 나머지는 파일명에 해시가 붙어 URL 자체가 바뀐다.
          # (무효화는 월 1000경로까지 무료라 /* 로 긁을 이유가 없다)
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html"
