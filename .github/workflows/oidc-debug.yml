name: OIDC Debug
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: sub claim 출력
        run: |
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          PAY=$(echo "$TOK" | cut -d. -f2)
          PAD=$(( (4 - ${#PAY} % 4) % 4 )); PAY="$PAY$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAY" | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -c '
import sys,json
d=json.load(sys.stdin)
for k in ("sub","aud","repository","ref","event_name","workflow_ref"):
    print(f"{k} = {d.get(k)}")'
