name: CodeQL

# 정적 보안 분석(XSS·프로토타입 오염·안전하지 않은 URL 처리 등). 공개 저장소라 무료다.
# eslint·tsc가 잡는 것과 겹치지 않는다 — 저쪽은 스타일·타입, 이쪽은 데이터 흐름(taint)이다.
# CI를 막지는 않는다: 결과는 Security 탭에 쌓이고, 심각한 건은 거기서 판단한다.

on:
  push:
    branches: [main, develop]
  pull_request:
  # 코드가 그대로여도 쿼리 팩은 갱신된다 — 주 1회 재분석해 새 규칙이 옛 코드를 훑게 한다.
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:javascript-typescript"
